
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte interactive des régions de Tunisie</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* STYLE GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f8;
}

header {
    background: #17365d;
    color: white;
    padding: 16px;
    text-align: center;
}

header h2 {
    margin: 0;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

/* PARTIE CARTE */

.map-area {
    width: 68%;
    padding: 15px;
}

#map {
    width: 100%;
    height: 88%;
    background: #eaf2f8;
    border: 2px solid #ccc;
    border-radius: 10px;
}

/* PANNEAU DROIT */

.panel {
    width: 32%;
    padding: 20px;
    background: white;
    border-left: 2px solid #ddd;
    overflow-y: auto;
}

.panel h3 {
    color: #17365d;
}

/* COORDONNEES */

.controls {
    background: white;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
}

input {
    width: 120px;
    padding: 9px;
    margin: 5px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    background: #1769d2;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #104b9b;
}

#coordonnees {
    color: #1769d2;
    font-weight: bold;
}

/* BOUTON RETOUR */

#btnRetour {
    display: none;
    background: #17365d;
    margin-bottom: 10px;
}

#btnRetour:hover {
    background: #28558b;
}

/* NOMS DES REGIONS */

.region-label {
    background: transparent;
    border: none;
    text-align: center;
}

.region-label span {
    display: inline-block;
    padding: 8px 12px;
    background: rgba(255,255,255,0.93);
    border: 2px solid #17365d;
    border-radius: 8px;
    color: #17365d;
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* NOMS DES VILLES */

.city-label {
    background: transparent;
    border: none;
    color: #17365d;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        1px 1px white,
        -1px -1px white,
        1px -1px white,
        -1px 1px white;
}

/* LEGENDE */

.legende {
    background: white;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    line-height: 25px;
    font-size: 13px;
}

.legende strong {
    display: block;
    margin-bottom: 8px;
    color: #17365d;
}

.legende-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.couleur-region {
    width: 17px;
    height: 17px;
    border: 1px solid #777;
    border-radius: 3px;
    flex-shrink: 0;
}

/* GRAPHIQUE */

#graphique {
    margin-top: 20px;
}

#details {
    line-height: 1.8;
    color: #1769d2;
}

/* RESPONSIVE */

@media(max-width: 800px) {

    .container {
        flex-direction: column;
        height: auto;
    }

    .map-area,
    .panel {
        width: 100%;
    }

    #map {
        height: 550px;
    }

}

</style>
</head>

<body>

<header>
    <h2>Carte interactive des régions de Tunisie</h2>
</header>

<div class="container">

<!-- PARTIE GAUCHE -->

<div class="map-area">

    <div class="controls">

        <button id="btnRetour" onclick="retourRegions()">
            ← Retour aux 4 régions
        </button>

        <br>

        <strong>Ajouter des coordonnées GPS :</strong>

        <br>

        Latitude :

        <input type="number"
        id="lat"
        placeholder="Latitude"
        step="any">

        Longitude :

        <input type="number"
        id="lng"
        placeholder="Longitude"
        step="any">

        <button onclick="ajouterPoint()">
            Ajouter le point
        </button>

        <p id="coordonnees">
            Aucune coordonnée sélectionnée
        </p>

        <p id="instruction">
            Cliquez sur une région pour afficher ses villes.
        </p>

    </div>

    <div id="map"></div>

</div>

<!-- PARTIE DROITE -->

<div class="panel">

    <h3>Informations géographiques</h3>

    <p id="nomPoint">
        Sélectionnez un point bleu
    </p>

    <p id="details">
        Latitude : -- <br>
        Longitude : --
    </p>

    <canvas id="graphique"></canvas>

</div>

</div>

<script>

// ==========================================
// 1. INITIALISATION DE LA CARTE
// ==========================================

const map = L.map('map', {

    zoomControl: true,

    minZoom: 6,

    maxZoom: 15,

    maxBounds: [
        [29, 6],
        [38, 12.5]
    ],

    maxBoundsViscosity: 1

});

// Aucun fond de carte mondial.

// ==========================================
// 2. DEFINITION DES 4 REGIONS
// ==========================================

const regions = {

    "Nord-Est": {

        couleur: "#F4A261",

        gouvernorats: [
            "Tunis",
            "Ariana",
            "Ben Arous",
            "Manouba",
            "Nabeul",
            "Zaghouan"
        ]

    },

    "Nord-Ouest": {

        couleur: "#4A90D9",

        gouvernorats: [
            "Bizerte",
            "Beja",
            "Jendouba",
            "Kef",
            "Siliana"
        ]

    },

    "Centre": {

        couleur: "#64A66A",

        gouvernorats: [
            "Sousse",
            "Monastir",
            "Mahdia",
            "Kairouan",
            "Kasserine",
            "Sidi Bouzid",
            "Sfax"
        ]

    },

    "Sud": {

        couleur: "#A78BCA",

        gouvernorats: [
            "Gabes",
            "Medenine",
            "Tataouine",
            "Gafsa",
            "Tozeur",
            "Kebili"
        ]

    }

};

// ==========================================
// 3. LES VILLES PAR REGION
// ==========================================

const villes = [

    // NORD-EST

    {
        nom: "Tunis",
        lat: 36.8065,
        lng: 10.1815,
        region: "Nord-Est"
    },

    {
        nom: "Ariana",
        lat: 36.8625,
        lng: 10.1956,
        region: "Nord-Est"
    },

    {
        nom: "Ben Arous",
        lat: 36.7531,
        lng: 10.2189,
        region: "Nord-Est"
    },

    {
        nom: "La Manouba",
        lat: 36.8081,
        lng: 10.0972,
        region: "Nord-Est"
    },

    {
        nom: "Nabeul",
        lat: 36.4513,
        lng: 10.7357,
        region: "Nord-Est"
    },

    {
        nom: "Zaghouan",
        lat: 36.4029,
        lng: 10.1429,
        region: "Nord-Est"
    },

    // NORD-OUEST

    {
        nom: "Bizerte",
        lat: 37.2744,
        lng: 9.8739,
        region: "Nord-Ouest"
    },

    {
        nom: "Béja",
        lat: 36.7256,
        lng: 9.1817,
        region: "Nord-Ouest"
    },

    {
        nom: "Jendouba",
        lat: 36.5011,
        lng: 8.7802,
        region: "Nord-Ouest"
    },

    {
        nom: "Le Kef",
        lat: 36.1742,
        lng: 8.7049,
        region: "Nord-Ouest"
    },

    {
        nom: "Siliana",
        lat: 36.0849,
        lng: 9.3708,
        region: "Nord-Ouest"
    },

    // CENTRE

    {
        nom: "Sousse",
        lat: 35.8256,
        lng: 10.6084,
        region: "Centre"
    },

    {
        nom: "Monastir",
        lat: 35.7770,
        lng: 10.8262,
        region: "Centre"
    },

    {
        nom: "Mahdia",
        lat: 35.5047,
        lng: 11.0622,
        region: "Centre"
    },

    {
        nom: "Kairouan",
        lat: 35.6781,
        lng: 10.0963,
        region: "Centre"
    },

    {
        nom: "Kasserine",
        lat: 35.1676,
        lng: 8.8365,
        region: "Centre"
    },

    {
        nom: "Sidi Bouzid",
        lat: 35.0382,
        lng: 9.4858,
        region: "Centre"
    },

    {
        nom: "Sfax",
        lat: 34.7406,
        lng: 10.7603,
        region: "Centre"
    },

    // SUD

    {
        nom: "Gabès",
        lat: 33.8815,
        lng: 10.0982,
        region: "Sud"
    },

    {
        nom: "Médenine",
        lat: 33.3549,
        lng: 10.5055,
        region: "Sud"
    },

    {
        nom: "Tataouine",
        lat: 32.9297,
        lng: 10.4518,
        region: "Sud"
    },

    {
        nom: "Gafsa",
        lat: 34.4250,
        lng: 8.7842,
        region: "Sud"
    },

    {
        nom: "Tozeur",
        lat: 33.9197,
        lng: 8.1335,
        region: "Sud"
    },

    {
        nom: "Kébili",
        lat: 33.7044,
        lng: 8.9690,
        region: "Sud"
    }

];

// ==========================================
// 4. NORMALISATION DES NOMS
// ==========================================

function normaliser(nom) {

    return String(nom)

        .normalize("NFD")

        .replace(/[\u0300-\u036f]/g, "")

        .toLowerCase()

        .trim();

}

// ==========================================
// 5. IDENTIFIER LES GOUVERNORATS
// ==========================================

function nomGouvernorat(feature) {

    const p = feature.properties;

    return p.NAME_1 ||
           p.name ||
           p.nom ||
           p.NAME ||
           "Gouvernorat";

}

function trouverRegion(nom) {

    const nomNormalise = normaliser(nom);

    for (const [region, infos] of Object.entries(regions)) {

        const existe = infos.gouvernorats.some(
            gouvernorat =>
                normaliser(gouvernorat) === nomNormalise
        );

        if (existe) return region;

    }

    return null;

}

// ==========================================
// 6. VARIABLES DE LA CARTE
// ==========================================

let coucheTunisie;

let couchesRegions = {};

let marqueursRegions = [];

let coucheVilles = L.layerGroup().addTo(map);

let regionSelectionnee = null;

let graphique = null;

let numero = 0;

// ==========================================
// 7. STYLE DES GOUVERNORATS
// ==========================================

function styleRegion(feature) {

    const nom = nomGouvernorat(feature);

    const region = trouverRegion(nom);

    return {

        color: "#ffffff",

        weight: 2,

        fillColor: region
            ? regions[region].couleur
            : "#cccccc",

        fillOpacity: 0.85

    };

}

// ==========================================
// 8. CHARGEMENT DES FRONTIERES
// ==========================================

fetch(
'https://raw.githubusercontent.com/riatelab/tunisie/master/data/TN-gouvernorats.geojson'
)

.then(response => {

    if (!response.ok) {
        throw new Error("Erreur de chargement");
    }

    return response.json();

})

.then(data => {

    coucheTunisie = L.geoJSON(data, {

        style: styleRegion,

        onEachFeature: function(feature, layer) {

            const nom = nomGouvernorat(feature);

            const region = trouverRegion(nom);

            if (!region) {
                console.warn("Gouvernorat non classé :", nom);
                return;
            }

            // Ajouter le gouvernorat à sa région

            if (!couchesRegions[region]) {

                couchesRegions[region] = [];

            }

            couchesRegions[region].push(layer);

            // Informations au survol

            layer.bindTooltip(

                "<b>" + nom + "</b><br>" +
                "Région : " + region,

                {
                    sticky: true
                }

            );

            // Effet de survol

            layer.on('mouseover', function() {

                layer.setStyle({

                    weight: 3,

                    color: "#222",

                    fillOpacity: 1

                });

            });

            layer.on('mouseout', function() {

                coucheTunisie.resetStyle(layer);

            });

            // CLIC SUR UN GOUVERNORAT

            layer.on('click', function() {

                if (region) {

                    afficherRegion(region);

                }

            });

        }

    }).addTo(map);

    // Vue générale

    afficherToutesRegions();

})

.catch(error => {

    console.error(error);

    alert(
        "Impossible de charger les frontières de la Tunisie."
    );

});

// ==========================================
// 9. AFFICHER LES NOMS DES 4 REGIONS
// ==========================================

function afficherToutesRegions() {

    // Supprimer les anciens noms de régions

    supprimerMarqueursRegions();

    // Supprimer les villes

    coucheVilles.clearLayers();

    regionSelectionnee = null;

    document.getElementById("btnRetour").style.display = "none";

    document.getElementById("instruction").innerText =
        "Cliquez sur une région pour afficher ses villes.";

    // Afficher les quatre régions

    for (const nomRegion of Object.keys(regions)) {

        const couches = couchesRegions[nomRegion] || [];

        if (couches.length === 0) continue;

        const groupe = L.featureGroup(couches);

        const centre = groupe.getBounds().getCenter();

        const icone = L.divIcon({

            className: "region-label",

            html: "<span>" + nomRegion + "</span>",

            iconSize: [140, 35],

            iconAnchor: [70, 17]

        });

        const marqueur = L.marker(centre, {

            icon: icone,

            zIndexOffset: 1000

        }).addTo(map);

        marqueur.on('click', function() {

            afficherRegion(nomRegion);

        });

        marqueursRegions.push(marqueur);

    }

    // Retour à la vue générale de la Tunisie

    map.fitBounds(coucheTunisie.getBounds(), {
        padding: [20, 20]
    });

}

// ==========================================
// 10. SUPPRIMER LES LABELS DES REGIONS
// ==========================================

function supprimerMarqueursRegions() {

    marqueursRegions.forEach(function(marqueur) {

        map.removeLayer(marqueur);

    });

    marqueursRegions = [];

}

// ==========================================
// 11. AFFICHER UNE REGION ET SES VILLES
// ==========================================

function afficherRegion(nomRegion) {

    if (!couchesRegions[nomRegion]) return;

    regionSelectionnee = nomRegion;

    // Supprimer les noms des quatre régions

    supprimerMarqueursRegions();

    // Supprimer les anciennes villes

    coucheVilles.clearLayers();

    // Afficher le bouton retour

    document.getElementById("btnRetour").style.display =
        "inline-block";

    document.getElementById("instruction").innerText =
        "Région sélectionnée : " + nomRegion +
        " — Les villes de cette région sont affichées.";

    // Créer un groupe avec les gouvernorats de la région

    const groupeRegion = L.featureGroup(
        couchesRegions[nomRegion]
    );

    // Zoom automatique sur la région

    map.fitBounds(

        groupeRegion.getBounds(),

        {
            padding: [40, 40],
            maxZoom: 9
        }

    );

    // Afficher uniquement les villes de cette région

    const villesRegion = villes.filter(function(ville) {

        return ville.region === nomRegion;

    });

    villesRegion.forEach(function(ville) {

        const icone = L.divIcon({

            className: "city-label",

            html: "● " + ville.nom,

            iconSize: [110, 20],

            iconAnchor: [5, 10]

        });

        const marqueur = L.marker(

            [ville.lat, ville.lng],

            {
                icon: icone
            }

        ).addTo(coucheVilles);

        marqueur.bindPopup(

            "<b>" + ville.nom + "</b><br>" +
            "Région : " + nomRegion +
            "<br>Latitude : " + ville.lat +
            "<br>Longitude : " + ville.lng

        );

    });

}

// ==========================================
// 12. RETOUR AUX QUATRE REGIONS
// ==========================================

function retourRegions() {

    afficherToutesRegions();

}

// ==========================================
// 13. LEGENDE DES REGIONS
// ==========================================

const legende = L.control({

    position: "bottomright"

});

legende.onAdd = function(map) {

    const div = L.DomUtil.create("div", "legende");

    let contenu = "<strong>Régions de Tunisie</strong>";

    for (const [nom, infos] of Object.entries(regions)) {

        contenu += `

            <div class="legende-item">

                <span class="couleur-region"
                style="background:${infos.couleur}">
                </span>

                ${nom}

            </div>

        `;

    }

    div.innerHTML = contenu;

    L.DomEvent.disableClickPropagation(div);

    return div;

};

legende.addTo(map);

// ==========================================
// 14. AJOUT DES POINTS GPS EN BLEU
// ==========================================

function ajouterPoint() {

    const lat = parseFloat(
        document.getElementById("lat").value
    );

    const lng = parseFloat(
        document.getElementById("lng").value
    );

    if (

        !Number.isFinite(lat) ||

        !Number.isFinite(lng) ||

        lat < 30 || lat > 37.5 ||

        lng < 7 || lng > 12

    ) {

        alert("Veuillez saisir des coordonnées valides en Tunisie.");

        return;

    }

    numero++;

    const point = {

        id: numero,

        lat: lat,

        lng: lng

    };

    // Marqueur bleu

    const marqueur = L.circleMarker(

        [lat, lng],

        {

            radius: 8,

            color: "blue",

            fillColor: "#1685ff",

            fillOpacity: 1,

            weight: 2

        }

    ).addTo(map);

    marqueur.bindPopup("Point " + numero);

    marqueur.on("click", function() {

        afficherGraphique(point);

    });

    map.setView([lat, lng], 10);

    afficherGraphique(point);

}

// ==========================================
// 15. CLIC SUR LA CARTE : COORDONNEES
// ==========================================

map.on("click", function(e) {

    const lat = e.latlng.lat;

    const lng = e.latlng.lng;

    document.getElementById("lat").value =
        lat.toFixed(6);

    document.getElementById("lng").value =
        lng.toFixed(6);

    document.getElementById("coordonnees").innerText =

        "Latitude : " + lat.toFixed(6) +

        " | Longitude : " + lng.toFixed(6);

});

// ==========================================
// 16. GRAPHIQUE A DROITE
// ==========================================

function afficherGraphique(point) {

    document.getElementById("nomPoint").innerHTML =

        "<strong>Point " + point.id + "</strong>";

    document.getElementById("details").innerHTML =

        "Latitude : " + point.lat.toFixed(6) +

        "<br>Longitude : " + point.lng.toFixed(6);

    document.getElementById("coordonnees").innerText =

        "Latitude : " + point.lat.toFixed(6) +

        " | Longitude : " + point.lng.toFixed(6);

    // Valeurs fictives de démonstration

    const valeurs = [
        12, 18, 15, 25, 20, 30, 27
    ];

    const mois = [

        "Janvier",
        "Février",
        "Mars",
        "Avril",
        "Mai",
        "Juin",
        "Juillet"

    ];

    if (graphique) {

        graphique.destroy();

    }

    graphique = new Chart(

        document.getElementById("graphique"),

        {

            type: "line",

            data: {

                labels: mois,

                datasets: [{

                    label: "Valeurs du point",

                    data: valeurs,

                    borderColor: "#1769d2",

                    backgroundColor:
                    "rgba(23,105,210,0.15)",

                    borderWidth: 3,

                    fill: true,

                    tension: 0.4

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    title: {

                        display: true,

                        text: "Graphique du point " + point.id

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        }

    );

}

</script>

</body>
</html>
