
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte interactive de la Tunisie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial;
    background: #f2f5f9;
}

header {
    background: #17365d;
    color: white;
    text-align: center;
    padding: 15px;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.map-area {
    width: 68%;
    padding: 15px;
}

#map {
    width: 100%;
    height: 90%;
    background: #eaf2f8;
    border: 2px solid #ccc;
    border-radius: 10px;
}

.panel {
    width: 32%;
    padding: 20px;
    background: white;
    border-left: 1px solid #ddd;
}

.controls {
    padding: 10px;
    background: white;
    margin-bottom: 10px;
}

input {
    padding: 8px;
    width: 120px;
}

button {
    background: #1769d2;
    color: white;
    border: none;
    padding: 9px;
    cursor: pointer;
}

#coordonnees {
    color: blue;
    font-weight: bold;
}

</style>
</head>

<body>

<header>
<h2>Carte interactive de la Tunisie</h2>
</header>

<div class="container">

<div class="map-area">

<div class="controls">
Latitude :
<input type="number" id="lat" step="any">

Longitude :
<input type="number" id="lng" step="any">

<button onclick="ajouterPoint()">Ajouter</button>

<p id="coordonnees">Aucune coordonnée sélectionnée</p>
</div>

<div id="map"></div>

</div>

<div class="panel">

<h3>Informations géographiques</h3>

<p id="nomPoint">Sélectionnez un point bleu</p>

<p id="details"></p>

<canvas id="graphique"></canvas>

</div>
</div>

<script>

// Carte sans fond mondial
const map = L.map('map', {
    zoomControl: true,
    minZoom: 6,
    maxZoom: 15,
    maxBounds: [[29, 6], [38, 12]],
    maxBoundsViscosity: 1
});

// Charger les frontières des gouvernorats tunisiens
fetch(
'https://raw.githubusercontent.com/riatelab/tunisie/master/data/TN-gouvernorats.geojson'
)
.then(response => {
    if (!response.ok) throw new Error("Erreur de chargement");
    return response.json();
})
.then(data => {

    const couche = L.geoJSON(data, {
        style: {
            color: '#17365d',
            weight: 1.5,
            fillColor: '#dceaf5',
            fillOpacity: 1
        },

        onEachFeature: function(feature, layer) {

            const nom =
                feature.properties.NAME_1 ||
                feature.properties.name ||
                feature.properties.nom ||
                "Gouvernorat";

            layer.bindTooltip(nom, {
                sticky: true
            });

            layer.on('mouseover', function() {
                layer.setStyle({
                    fillColor: '#a9cce8'
                });
            });

            layer.on('mouseout', function() {
                couche.resetStyle(layer);
            });
        }
    }).addTo(map);

    map.fitBounds(couche.getBounds());

})
.catch(error => {
    alert("Impossible de charger la carte de Tunisie.");
    console.error(error);
});

// Marqueurs
let numero = 0;
let graphique = null;

function ajouterPoint() {

    const lat = parseFloat(
        document.getElementById('lat').value
    );

    const lng = parseFloat(
        document.getElementById('lng').value
    );

    if (!Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < 30 || lat > 37.5 ||
        lng < 7 || lng > 12) {

        alert("Coordonnées hors de la Tunisie");
        return;
    }

    numero++;

    const point = {
        id: numero,
        lat: lat,
        lng: lng
    };

    const marqueur = L.circleMarker(
        [lat, lng],
        {
            radius: 8,
            color: 'blue',
            fillColor: '#1685ff',
            fillOpacity: 1
        }
    ).addTo(map);

    marqueur.bindPopup("Point " + numero);

    marqueur.on('click', function() {
        afficherGraphique(point);
    });

    map.setView([lat, lng], 10);

    afficherGraphique(point);
}

// Sélection d'un point
function afficherGraphique(point) {

    document.getElementById('nomPoint').innerText =
        "Point " + point.id;

    document.getElementById('details').innerHTML =
        "Latitude : " + point.lat.toFixed(6) +
        "<br>Longitude : " + point.lng.toFixed(6);

    document.getElementById('coordonnees').innerText =
        "Latitude : " + point.lat.toFixed(6) +
        " | Longitude : " + point.lng.toFixed(6);

    if (graphique) {
        graphique.destroy();
    }

    graphique = new Chart(
        document.getElementById('graphique'),
        {
            type: 'line',

            data: {
                labels: [
                    'Janvier', 'Février', 'Mars',
                    'Avril', 'Mai', 'Juin', 'Juillet'
                ],

                datasets: [{
                    label: 'Valeurs du point',
                    data: [12, 18, 15, 25, 20, 30, 27],
                    borderColor: '#1769d2',
                    backgroundColor: 'rgba(23,105,210,0.15)',
                    fill: true,
                    tension: 0.3
                }]
            },

            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    }
                }
            }
        }
    );
}

</script>

</body>
</html>
