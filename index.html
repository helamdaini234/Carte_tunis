
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte interactive de la Tunisie</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #243447;
}

header {
    background: #173b57;
    color: white;
    padding: 16px;
    text-align: center;
}

header h2 {
    margin: 0;
}

.conteneur {
    display: flex;
    gap: 12px;
    padding: 12px;
    height: calc(100vh - 65px);
}

.carte-zone {
    flex: 1;
    min-width: 0;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    border: 1px solid #ccd4dc;
    background: #edf1f4;
}

.panneau {
    width: 330px;
    min-width: 280px;
    background: white;
    border-radius: 10px;
    padding: 16px;
    overflow-y: auto;
}

.panneau h3 {
    margin-top: 0;
    color: #173b57;
}

button {
    border: none;
    background: #173b57;
    color: white;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px 0;
}

button:hover {
    background: #28658d;
}

#retour {
    display: none;
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 15px;
}

input {
    width: 100%;
    padding: 9px;
    margin: 5px 0 10px;
    border: 1px solid #ccd4dc;
    border-radius: 5px;
}

.region-label {
    background: white;
    border: 2px solid #34495e;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 2px 5px #0003;
}

.city-label {
    background: white;
    border: 1px solid #42647e;
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 11px;
    font-weight: bold;
    color: #173b57;
    white-space: nowrap;
    box-shadow: 0 1px 4px #0003;
    cursor: pointer;
}

.legende {
    position: absolute;
    bottom: 18px;
    left: 15px;
    z-index: 900;
    background: white;
    padding: 10px;
    border-radius: 7px;
    box-shadow: 0 2px 6px #0003;
    font-size: 12px;
}

.legende div {
    margin: 5px 0;
}

.couleur {
    display: inline-block;
    width: 13px;
    height: 13px;
    margin-right: 6px;
    vertical-align: middle;
    border-radius: 2px;
}

#message {
    font-size: 13px;
    color: #526779;
    margin: 8px 0;
}

@media(max-width: 800px) {
    .conteneur {
        flex-direction: column;
        height: auto;
    }

    .carte-zone {
        height: 65vh;
    }

    .panneau {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h2>Carte interactive de la Tunisie</h2>
</header>

<div class="conteneur">

    <div class="carte-zone">

        <button id="retour" onclick="retourRegions()">
            ← Retour aux 4 régions
        </button>

        <div id="map"></div>

        <div class="legende">
            <div><span class="couleur" style="background:#F4A261"></span>Nord-Est</div>
            <div><span class="couleur" style="background:#4A90D9"></span>Nord-Ouest</div>
            <div><span class="couleur" style="background:#64A66A"></span>Centre</div>
            <div><span class="couleur" style="background:#A78BCA"></span>Sud</div>
        </div>

    </div>

    <aside class="panneau">

        <h3 id="titrePanneau">Informations</h3>

        <p id="details">
            Cliquez sur une région pour afficher ses villes.
        </p>

        <p id="message">Chargement des données...</p>

        <hr>

        <h3>Ajouter un point GPS</h3>

        <label>Latitude</label>
        <input type="number" id="latitude" step="any"
               placeholder="Exemple : 36.8065">

        <label>Longitude</label>
        <input type="number" id="longitude" step="any"
               placeholder="Exemple : 10.1815">

        <button onclick="ajouterPoint()">Ajouter le point bleu</button>

        <hr>

        <h3>Graphique</h3>
        <canvas id="graphique"></canvas>

    </aside>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

// ==========================================
// 1. INITIALISATION DE LA CARTE
// ==========================================

const map = L.map("map", {
    zoomControl: true,
    minZoom: 6,
    maxZoom: 12,
    maxBounds: [[29, 6], [38.5, 12]],
    maxBoundsViscosity: 1
});

const boundsTunisie = L.latLngBounds(
    [30.0, 7.0],
    [37.7, 11.7]
);

map.fitBounds(boundsTunisie);

const coucheVilles = L.layerGroup().addTo(map);
const coucheGPS = L.layerGroup().addTo(map);

let coucheGouvernorats;
let marqueursRegions = [];
let graphique = null;
let regionSelectionnee = null;

const couchesRegions = {
    "Nord-Est": [],
    "Nord-Ouest": [],
    "Centre": [],
    "Sud": []
};

// ==========================================
// 2. DEFINITION DES 4 REGIONS
// ==========================================

const regions = {
    "Nord-Est": {
        couleur: "#F4A261",
        gouvernorats: [
            "TN-11", "TN-12", "TN-13", "TN-14",
            "TN-21", "TN-22"
        ]
    },

    "Nord-Ouest": {
        couleur: "#4A90D9",
        gouvernorats: [
            "TN-23", "TN-31", "TN-32",
            "TN-33", "TN-34"
        ]
    },

    "Centre": {
        couleur: "#64A66A",
        gouvernorats: [
            "TN-41", "TN-42", "TN-43",
            "TN-51", "TN-52", "TN-53", "TN-61"
        ]
    },

    "Sud": {
        couleur: "#A78BCA",
        gouvernorats: [
            "TN-71", "TN-72", "TN-73",
            "TN-81", "TN-82", "TN-83"
        ]
    }
};

// ==========================================
// 3. IDENTIFICATION DES GOUVERNORATS
// ==========================================

function normaliser(texte) {
    return String(texte || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/^la\s+/, "")
        .replace(/^le\s+/, "")
        .trim();
}

const nomsGouvernorats = {
    "tunis": "TN-11",
    "ariana": "TN-12",
    "ben arous": "TN-13",
    "manouba": "TN-14",
    "nabeul": "TN-21",
    "zaghouan": "TN-22",
    "bizerte": "TN-23",
    "beja": "TN-31",
    "jendouba": "TN-32",
    "kef": "TN-33",
    "siliana": "TN-34",
    "kairouan": "TN-41",
    "kasserine": "TN-42",
    "sidi bouzid": "TN-43",
    "sousse": "TN-51",
    "monastir": "TN-52",
    "mahdia": "TN-53",
    "sfax": "TN-61",
    "gafsa": "TN-71",
    "tozeur": "TN-72",
    "kebili": "TN-73",
    "gabes": "TN-81",
    "medenine": "TN-82",
    "tataouine": "TN-83"
};

function codeGouvernorat(feature) {
    const p = feature.properties || {};

    const valeurs = [
        p.id,
        p.code,
        p.iso,
        p.iso_3166_2,
        p.name_fr,
        p.nom_fr,
        p.name,
        p.NAME_1,
        p.nom,
        feature.id
    ];

    for (const valeur of valeurs) {
        const texte = String(valeur || "").toUpperCase();

        if (/^TN-\d+$/.test(texte)) {
            return texte;
        }

        const nom = normaliser(valeur);

        if (nomsGouvernorats[nom]) {
            return nomsGouvernorats[nom];
        }
    }

    return null;
}

function regionDuGouvernorat(code) {
    if (!code) return null;

    for (const [nom, region] of Object.entries(regions)) {
        if (region.gouvernorats.includes(code)) {
            return nom;
        }
    }

    return null;
}

// ==========================================
// 4. CHARGEMENT DES DONNEES DES VILLES
// ==========================================

const URL_VILLES =
"https://raw.githubusercontent.com/Alaa-Taieb/map-tunisia/main/dist/data/cities.csv";

const URL_GOUVERNORATS =
"https://raw.githubusercontent.com/Alaa-Taieb/map-tunisia/main/dist/geojson/tunisia-governorates-medium.geojson";

let villes = [];

async function chargerVilles() {

    const reponse = await fetch(URL_VILLES);

    if (!reponse.ok) {
        throw new Error("Impossible de charger le fichier des villes.");
    }

    const csv = await reponse.text();

    const resultat = Papa.parse(csv, {
        header: true,
        skipEmptyLines: true
    });

    villes = resultat.data
        .map(v => {
            const code = String(v.governorate || "").toUpperCase();

            return {
                nom: v.name_fr || v.name_en || v.name_ar || "Localité",
                lat: Number(v.lat),
                lng: Number(v.lon),
                code: code,
                region: regionDuGouvernorat(code),
                type: v.place || "localité"
            };
        })
        .filter(v =>
            Number.isFinite(v.lat) &&
            Number.isFinite(v.lng) &&
            v.region
        );

    return villes;
}

// ==========================================
// 5. STYLE DES GOUVERNORATS
// ==========================================

function styleGouvernorat(feature) {

    const code = codeGouvernorat(feature);
    const region = regionDuGouvernorat(code);

    return {
        color: "#ffffff",
        weight: 1.5,
        opacity: 1,
        fillColor: region
            ? regions[region].couleur
            : "#cccccc",
        fillOpacity: 0.8
    };
}

// ==========================================
// 6. LABELS DES REGIONS
// ==========================================

function supprimerLabelsRegions() {
    marqueursRegions.forEach(m => map.removeLayer(m));
    marqueursRegions = [];
}

function afficherLabelsRegions() {

    supprimerLabelsRegions();

    for (const nomRegion of Object.keys(regions)) {

        const couches = couchesRegions[nomRegion];

        if (!couches.length) continue;

        const groupe = L.featureGroup(couches);
        const centre = groupe.getBounds().getCenter();

        const label = L.marker(centre, {
            icon: L.divIcon({
                className: "",
                html: `<div class="region-label">${nomRegion}</div>`,
                iconSize: null,
                iconAnchor: [55, 15]
            })
        }).addTo(map);

        label.on("click", function() {
            afficherRegion(nomRegion);
        });

        marqueursRegions.push(label);
    }
}

// ==========================================
// 7. AFFICHER UNE REGION ET SES VILLES
// ==========================================

function echapperHTML(texte) {
    return String(texte).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function afficherRegion(nomRegion) {

    regionSelectionnee = nomRegion;

    supprimerLabelsRegions();
    coucheVilles.clearLayers();

    document.getElementById("retour").style.display = "block";

    document.getElementById("titrePanneau").textContent =
        nomRegion;

    const villesRegion = villes.filter(v =>
        v.region === nomRegion
    );

    document.getElementById("details").innerHTML =
        `<b>${villesRegion.length}</b> villes et localités répertoriées dans la région ${nomRegion}.`;

    const couches = couchesRegions[nomRegion];

    if (couches.length) {

        const groupe = L.featureGroup(couches);

        map.fitBounds(groupe.getBounds(), {
            padding: [35, 35],
            maxZoom: 9,
            animate: true
        });
    }

    // Afficher toutes les localités de la région

    villesRegion.forEach(ville => {

        const marqueur = L.marker(
            [ville.lat, ville.lng],
            {
                icon: L.divIcon({
                    className: "",
                    html: `<div class="city-label">${echapperHTML(ville.nom)}</div>`,
                    iconSize: null,
                    iconAnchor: [-3, 8]
                })
            }
        );

        marqueur.addTo(coucheVilles);

        marqueur.on("click", function() {
            afficherVille(ville);
        });

        marqueur.bindTooltip(
            ville.nom,
            { direction: "top" }
        );
    });

    document.getElementById("message").textContent =
        villesRegion.length + " localités affichées sur la carte.";
}

// ==========================================
// 8. AFFICHER LES INFORMATIONS D'UNE VILLE
// ==========================================

function afficherVille(ville) {

    document.getElementById("titrePanneau").textContent =
        ville.nom;

    document.getElementById("details").innerHTML = `
        <b>Ville :</b> ${echapperHTML(ville.nom)}<br><br>
        <b>Région :</b> ${echapperHTML(ville.region)}<br><br>
        <b>Latitude :</b> ${ville.lat}<br>
        <b>Longitude :</b> ${ville.lng}<br><br>
        <b>Type :</b> ${echapperHTML(ville.type)}
    `;

    document.getElementById("latitude").value = ville.lat;
    document.getElementById("longitude").value = ville.lng;

    afficherGraphique(ville.nom);
}

// ==========================================
// 9. RETOUR A LA CARTE GENERALE
// ==========================================

function retourRegions() {

    regionSelectionnee = null;

    coucheVilles.clearLayers();

    supprimerLabelsRegions();

    document.getElementById("retour").style.display = "none";

    document.getElementById("titrePanneau").textContent =
        "Informations";

    document.getElementById("details").textContent =
        "Cliquez sur une région pour afficher ses villes.";

    document.getElementById("message").textContent =
        "Vue générale de la Tunisie.";

    map.fitBounds(boundsTunisie, {
        padding: [20, 20],
        animate: true
    });

    afficherLabelsRegions();
}

// ==========================================
// 10. GRAPHIQUE
// ==========================================

function afficherGraphique(nom) {

    const ctx = document.getElementById("graphique");

    if (graphique) {
        graphique.destroy();
    }

    graphique = new Chart(ctx, {
        type: "line",

        data: {
            labels: [
                "Janvier",
                "Février",
                "Mars",
                "Avril",
                "Mai",
                "Juin",
                "Juillet"
            ],

            datasets: [{
                label: "Données de " + nom,
                data: [12, 18, 15, 25, 20, 30, 27],
                borderColor: "#2878b5",
                backgroundColor: "#2878b522",
                fill: true,
                tension: 0.3
            }]
        },

        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });
}

// ==========================================
// 11. AJOUTER UN POINT GPS BLEU
// ==========================================

function ajouterPoint() {

    const lat = Number(
        document.getElementById("latitude").value
    );

    const lng = Number(
        document.getElementById("longitude").value
    );

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < 30 || lat > 38 ||
        lng < 7 || lng > 12
    ) {
        alert("Veuillez saisir des coordonnées valides en Tunisie.");
        return;
    }

    const point = L.circleMarker(
        [lat, lng],
        {
            radius: 8,
            color: "#0055ff",
            fillColor: "#007bff",
            fillOpacity: 1,
            weight: 2
        }
    ).addTo(coucheGPS);

    point.bindPopup(
        `Point GPS<br>Latitude : ${lat}<br>Longitude : ${lng}`
    );

    point.on("click", function() {
        afficherGraphique("Point GPS");
    });

    map.setView([lat, lng], 10);

    point.openPopup();
}

// ==========================================
// 12. RECUPERER LES COORDONNEES AU CLIC
// ==========================================

map.on("click", function(e) {

    document.getElementById("latitude").value =
        e.latlng.lat.toFixed(6);

    document.getElementById("longitude").value =
        e.latlng.lng.toFixed(6);
});

// ==========================================
// 13. CHARGEMENT DE LA CARTE ET DES DONNEES
// ==========================================

async function initialiserCarte() {

    try {

        document.getElementById("message").textContent =
            "Chargement de la carte et des localités...";

        const [reponseGeo, donneesVilles] = await Promise.all([
            fetch(URL_GOUVERNORATS),
            chargerVilles()
        ]);

        if (!reponseGeo.ok) {
            throw new Error("Impossible de charger les gouvernorats.");
        }

        const geojson = await reponseGeo.json();

        coucheGouvernorats = L.geoJSON(geojson, {

            style: styleGouvernorat,

            onEachFeature: function(feature, layer) {

                const code = codeGouvernorat(feature);
                const region = regionDuGouvernorat(code);

                const nom = feature.properties.name_fr ||
                            feature.properties.nom_fr ||
                            feature.properties.name ||
                            feature.properties.NAME_1 ||
                            code ||
                            "Gouvernorat";

                if (region) {
                    couchesRegions[region].push(layer);
                }

                layer.bindTooltip(nom);

                layer.on("mouseover", function() {
                    layer.setStyle({
                        weight: 3,
                        color: "#222",
                        fillOpacity: 0.95
                    });
                });

                layer.on("mouseout", function() {
                    coucheGouvernorats.resetStyle(layer);
                });

                layer.on("click", function(e) {

                    L.DomEvent.stopPropagation(e);

                    if (region) {
                        afficherRegion(region);
                    }
                });
            }

        }).addTo(map);

        map.fitBounds(coucheGouvernorats.getBounds(), {
            padding: [20, 20]
        });

        afficherLabelsRegions();

        document.getElementById("message").textContent =
            donneesVilles.length +
            " localités chargées. Cliquez sur une région.";

    } catch (erreur) {

        console.error(erreur);

        document.getElementById("message").textContent =
            "Erreur de chargement : " + erreur.message;

        alert(
            "Impossible de charger les données. Vérifiez votre connexion Internet."
        );
    }
}

initialiserCarte();

</script>

</body>
</html>
