
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte interactive de la Tunisie</title>

<!-- Leaflet : carte interactive -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js : graphiques -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f8;
}

header {
    background: #17365d;
    color: white;
    padding: 15px;
    text-align: center;
}

header h2 {
    margin: 0;
}

.container {
    display: flex;
    height: calc(100vh - 65px);
}

.left-panel {
    width: 68%;
    padding: 15px;
}

.right-panel {
    width: 32%;
    background: white;
    padding: 20px;
    border-left: 2px solid #ddd;
}

#map {
    width: 100%;
    height: 75%;
    border-radius: 10px;
    border: 2px solid #ccc;
}

.controls {
    background: white;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
}

input {
    width: 130px;
    padding: 9px;
    margin: 5px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    background: #1769d2;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #104b9b;
}

#coordinates {
    color: #1769d2;
    font-weight: bold;
    margin-top: 10px;
}

.right-panel h3 {
    color: #17365d;
}

#chartContainer {
    margin-top: 30px;
}

#info {
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h2>Carte interactive de la Tunisie</h2>
</header>

<div class="container">

    <!-- Partie gauche : Carte -->
    <div class="left-panel">

        <div class="controls">
            <strong>Ajouter un point géographique :</strong>
            <br>

            <input type="number" id="lat"
            placeholder="Latitude" step="any">

            <input type="number" id="lng"
            placeholder="Longitude" step="any">

            <button onclick="addPoint()">
                Ajouter le point
            </button>

            <div id="coordinates">
                Coordonnées : aucune sélection
            </div>
        </div>

        <div id="map"></div>

        <p id="info">
            Cliquez sur la carte pour sélectionner un emplacement
            ou ajoutez des coordonnées manuellement.
        </p>

    </div>

    <!-- Partie droite : Graphique -->
    <div class="right-panel">

        <h3>Informations du point sélectionné</h3>

        <p id="pointName">Aucun point sélectionné</p>

        <p id="pointCoordinates">
            Latitude : -- <br>
            Longitude : --
        </p>

        <div id="chartContainer">
            <canvas id="myChart"></canvas>
        </div>

    </div>

</div>

<script>

// Création de la carte centrée sur la Tunisie
var map = L.map('map', {
    maxBounds: [
        [29.0, 6.5],
        [38.0, 12.5]
    ],
    maxBoundsViscosity: 1.0
}).setView([34.0, 9.5], 6);

// Fond de carte
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

// Icône bleue personnalisée
var blueIcon = new L.Icon({
    iconUrl:
    'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
    shadowUrl:
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

var markers = [];
var chart = null;
var pointNumber = 0;

// Ajouter un point sur la carte
function addPoint() {

    var lat = parseFloat(document.getElementById("lat").value);
    var lng = parseFloat(document.getElementById("lng").value);

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < 29 || lat > 38 ||
        lng < 6.5 || lng > 12.5
    ) {
        alert("Veuillez entrer des coordonnées valides en Tunisie.");
        return;
    }

    createMarker(lat, lng);

    map.setView([lat, lng], 10);
}

// Création du marqueur bleu
function createMarker(lat, lng) {

    pointNumber++;

    var marker = L.marker([lat, lng], {
        icon: blueIcon
    }).addTo(map);

    marker.bindPopup("Point " + pointNumber);

    var point = {
        id: pointNumber,
        lat: lat,
        lng: lng,
        marker: marker
    };

    markers.push(point);

    marker.on('click', function() {
        showGraph(point);
    });

    showGraph(point);
}

// Ajouter un point directement en cliquant sur la carte
map.on('click', function(e) {

    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    document.getElementById("lat").value = lat.toFixed(6);
    document.getElementById("lng").value = lng.toFixed(6);

    document.getElementById("coordinates").innerHTML =
        "Latitude : " + lat.toFixed(6) +
        " | Longitude : " + lng.toFixed(6);

});

// Afficher les coordonnées et le graphique
function showGraph(point) {

    document.getElementById("pointName").innerHTML =
        "<strong>Point " + point.id + "</strong>";

    document.getElementById("pointCoordinates").innerHTML =
        "Latitude : " + point.lat.toFixed(6) +
        "<br>Longitude : " + point.lng.toFixed(6);

    document.getElementById("coordinates").innerHTML =
        "Latitude : " + point.lat.toFixed(6) +
        " | Longitude : " + point.lng.toFixed(6);

    // Données de démonstration
    var values = [
        12, 18, 15, 25, 20, 30, 27
    ];

    var labels = [
        "Janvier", "Février", "Mars",
        "Avril", "Mai", "Juin", "Juillet"
    ];

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(
        document.getElementById("myChart"),
        {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Valeurs du point",
                    data: values,

                    borderColor: "#1769d2",
                    backgroundColor: "rgba(23,105,210,0.15)",
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },

            options: {
                responsive: true,

                plugins: {
                    title: {
                        display: true,
                        text: "Graphique du point " + point.id
                    }
                },

                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        }
    );
}

</script>

</body>
</html>
